<style id="wide-skill-layout">
/* Widen the catalog and keep every skill header horizontal. */
.page-shell { max-width: 1680px; }
.skill-list { grid-template-columns: minmax(0, 1fr); }
.skill-header { flex-wrap: wrap; align-items: center; }
.skill-header > div { flex: 1 1 360px; }
.skill-header > div > div:last-child { flex: 1; min-width: 0; }
.skill-header h3 { word-break: normal; overflow-wrap: anywhere; }
.skill-header span.inline-flex { white-space: nowrap; flex-shrink: 0; }
.skill-source { flex: 0 1 auto; overflow-wrap: anywhere; }
.skill-trigger { white-space: normal; overflow-wrap: anywhere; }
.skill-card code { white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; }
@media (min-width: 1024px) {
  .content-layout { grid-template-columns: minmax(0, 1fr) 340px; }
}
@media (min-width: 1440px) {
  .content-layout { grid-template-columns: minmax(0, 1fr) 380px; }
}
@media (max-width: 639px) {
  .skill-card { padding: 20px; }
  .skill-header > div { flex-basis: 100%; }
  .skill-source { padding-left: 56px; }
}
</style>
